plugins {
	id 'application'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'com.fasterxml.jackson.core:jackson-databind:2.21.4'
	implementation 'com.formdev:flatlaf:3.7.2'
	testImplementation platform('org.junit:junit-bom:5.12.2')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
	mainClass = 'com.clipvault.client.TrayApp'
}

tasks.named('test') {
	useJUnitPlatform()
}

// ----- Windows 배포용 실행 파일 -----
// ./gradlew :tray-client:packageZip
//   → build/jpackage/ClipVault/ClipVault.exe  (자바 런타임 포함 포터블 폴더, JDK 없이 실행)
//   → build/dist/ClipVault-windows.zip        (위 폴더를 압축한 배포 파일)
def jpackageExe = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
        .map { it.metadata.installationPath.file('bin/jpackage').asFile.absolutePath }

tasks.register('packageApp', Exec) {
    group = 'distribution'
    description = 'jpackage로 ClipVault.exe 포터블 앱 이미지를 만든다'
    dependsOn 'installDist'
    def out = layout.buildDirectory.dir('jpackage').get().asFile
    doFirst {
        delete out
        executable jpackageExe.get()
    }
    args '--type', 'app-image',
            '--name', 'ClipVault',
            '--app-version', (findProperty('appVersion') ?: '1.0.0').toString(), // 릴리스 워크플로가 태그(v1.2.3)에서 넘겨준다
            '--vendor', 'ClipVault',
            '--input', layout.buildDirectory.dir('install/tray-client/lib').get().asFile.absolutePath,
            '--main-jar', 'tray-client.jar',
            '--main-class', 'com.clipvault.client.TrayApp',
            '--icon', file('packaging/ClipVault.ico').absolutePath,
            // 필요한 자바 모듈만 넣어 런타임 크기를 줄인다 (jdk.crypto.ec: HTTPS/WSS 연결에 필요)
            '--add-modules', 'java.base,java.desktop,java.net.http,java.prefs,java.sql,jdk.crypto.ec',
            '--java-options', '-Dfile.encoding=UTF-8',
            '--dest', out.absolutePath
}

tasks.register('packageZip', Zip) {
    group = 'distribution'
    description = 'ClipVault.exe 포터블 폴더를 zip으로 묶는다'
    dependsOn 'packageApp'
    from(layout.buildDirectory.dir('jpackage'))
    archiveFileName = 'ClipVault-windows.zip'
    destinationDirectory = layout.buildDirectory.dir('dist')
}
