server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

clipvault:
  jwt:
    secret: ${JWT_SECRET}
    access-ttl: 15m
    refresh-ttl: 30d
  crypto:
    key: ${CLIP_ENCRYPTION_KEY}
  clip:
    ttl: 7d
    cleanup-cron: "0 0 4 * * *"
