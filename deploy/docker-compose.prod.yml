# 운영 서버(Oracle Cloud VM 등)용 구성: 백엔드 + Caddy(HTTPS 자동 인증서 + 리버스 프록시).
# DB는 외부 관리형 PostgreSQL(Neon)을 쓰므로 여기엔 DB 컨테이너가 없다.
#
# 실행 (저장소 루트에서):
#   cp deploy/.env.example deploy/.env   # 값 채우기
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
services:
  backend:
    build:
      context: ..                    # 멀티프로젝트 Gradle 빌드라 저장소 루트를 컨텍스트로 쓴다
      dockerfile: backend/Dockerfile
    env_file: .env                   # DB_*, JWT_SECRET, CLIP_ENCRYPTION_KEY, S3_*
    restart: unless-stopped          # 서버 재부팅/크래시 후 자동 재시작
    mem_limit: 1g
    # 포트를 바깥에 직접 열지 않는다. 외부 요청은 모두 Caddy(443)를 거쳐 들어온다.
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"                      # 인증서 발급(HTTP-01 인증) + https로 리다이렉트
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data             # 발급받은 인증서 보관 (지우면 재발급됨)
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  caddy_data:
  caddy_config:
