# Release: v로 시작하는 태그(예: v1.0.1)를 푸시하면
# Windows에서 ClipVault.exe 포터블 zip을 빌드해 GitHub 릴리스로 올린다.
#
#   git tag v1.0.1 && git push origin v1.0.1
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # 릴리스 생성/파일 업로드

jobs:
  windows-exe:
    runs-on: windows-latest   # jpackage는 실행할 OS용 exe만 만들 수 있다
    defaults:
      run:
        shell: bash             # Windows 러너에서도 bash 문법으로 실행
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Test
        run: ./gradlew test

      # 태그 v1.0.1 → 앱 버전 1.0.1
      - name: Build ClipVault.exe
        run: ./gradlew :tray-client:packageZip -PappVersion="${GITHUB_REF_NAME#v}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          ## 설치 / 실행
          1. 아래 **ClipVault-windows.zip** 을 받아 압축을 풉니다.
          2. `ClipVault\ClipVault.exe` 를 실행합니다. (Java 설치 불필요 — 런타임 포함)
          3. 처음이면 **회원가입**, 다른 PC에서도 같은 계정으로 로그인하면 동기화됩니다.

          > 서명되지 않은 실행 파일이라 처음 실행 시 "Windows의 PC 보호" 경고가 뜰 수 있습니다. **추가 정보 → 실행**을 누르세요.

          EOF
          gh release create "$GITHUB_REF_NAME" tray-client/build/dist/ClipVault-windows.zip \
            --title "ClipVault $GITHUB_REF_NAME" --notes-file notes.md --generate-notes
