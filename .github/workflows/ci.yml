# CI: 모든 푸시와 PR에서 백엔드 통합 테스트 + 트레이 앱 단위 테스트를 돌린다.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에 새 커밋이 오면 이전 실행은 취소 (불필요한 대기 줄이기)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Gradle 의존성/빌드 캐시
      - uses: gradle/actions/setup-gradle@v6

      - name: Test
        run: ./gradlew test

      # 실패했을 때 원인을 볼 수 있도록 테스트 리포트를 남긴다
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/'
