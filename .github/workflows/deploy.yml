# Deploy: main에 백엔드/배포 설정이 바뀌면 테스트 후 오라클 VM에 자동 배포한다.
# VM에서 git pull → docker compose로 다시 빌드/재시작 → 외부에서 헬스 체크.
#
# 저장소 Settings → Secrets and variables → Actions 에 등록할 값:
#   Secrets:   DEPLOY_HOST (VM 공인 IP), DEPLOY_USER (예: ubuntu), DEPLOY_SSH_KEY (VM 접속용 개인키 전체 내용)
#   Variables: DEPLOY_PATH (선택, 기본 ~/ClipVault), DEPLOY_URL (선택, 기본 https://161-33-167-228.sslip.io)
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'deploy/**'
      - 'settings.gradle'
      - 'gradle/**'
  workflow_dispatch:   # Actions 탭에서 수동 실행도 가능

# 배포가 겹치지 않도록 한 번에 하나씩 (진행 중인 배포는 취소하지 않고 기다린다)
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :backend:test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '~/ClipVault' }}
      DEPLOY_URL: ${{ vars.DEPLOY_URL || 'https://161-33-167-228.sslip.io' }}
    steps:
      - name: Set up SSH key
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: Pull and restart on VM
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy "$USER@$HOST" bash -se <<EOF
          set -euo pipefail
          cd $DEPLOY_PATH
          git fetch origin main
          git reset --hard origin/main
          sudo docker compose -f deploy/docker-compose.prod.yml up -d --build
          sudo docker image prune -f
          EOF

      # 로그인 안 한 요청에 401이 오면 서버가 정상적으로 떠 있는 것
      - name: Health check
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$DEPLOY_URL/api/clips" || true)
            if [ "$code" = "401" ]; then echo "healthy"; exit 0; fi
            echo "waiting ($code)..."; sleep 5
          done
          echo "health check failed"; exit 1
